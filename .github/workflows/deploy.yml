name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter tokens build

      - name: Build app
        run: pnpm --filter app build

      - name: Configure wrangler.toml
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          sed -i "s/your-d1-database-id-here/${D1_ID}/" worker/wrangler.toml
          if [ -n "${SITE_DOMAIN}" ]; then
            sed -i "s/uppies.example.com/${SITE_DOMAIN}/" worker/wrangler.toml
          else
            sed -i '/^\[\[routes\]\]/,/^$/d' worker/wrangler.toml
          fi

      - name: Apply D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 execute uppies --remote --file=src/db/schema.sql

      - name: Sync monitors
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm seed:remote

      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy \
            --var SITE_TITLE:"${{ vars.SITE_TITLE || 'Uppies' }}" \
            --var SITE_THEME:"${{ vars.SITE_THEME || 'cyberpunk' }}" \
            --var CACHE_TTL:"${{ vars.CACHE_TTL || '30' }}" \
            --var MAX_BODY_BYTES:"${{ vars.MAX_BODY_BYTES || '1048576' }}" \
            --var HISTORY_DAYS:"${{ vars.HISTORY_DAYS || '90' }}"
